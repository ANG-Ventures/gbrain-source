# deploy/stack/env.schema.toml: the ONE definition of what `gbrainctl render` writes (card t_ab2fcba3).
# Same shape as mem0-selfhost-deploy stack/env.schema.toml (read that file's header for the full rules):
#   [[key]]   one line of <stack>/.env, in this order. source = "const" (value) | "host" (template, filled from
#             hosts/<name>.toml: {dotted.key}, {path:key} expands ~, {derived}) | "1p" (ref, read once per render
#             through the host's op_reader = op-cached-read).
#   [[file]]  a secret FILE under <stack>/secrets/ (0600, dir 0700, gitignored), granted to services by compose.
#             `field` picks KEY=VALUE out of a secure-note body; encoding = "base64" decodes; newline = true appends \n.
#   when      (gbrainctl addition) the host feature flag that must be true for this entry; when it is false the file
#             is written EMPTY (compose still needs the path to exist) and no 1Password read happens.
#   optional  (gbrainctl addition) an unreadable/empty 1P value writes an empty file instead of failing the render
#             (the Anthropic key: the launcher only warned, relay calls do not need it).
# A missing host value or required 1P value fails the render naming the KEY, never the value.

[meta]
schema_version = 1

# ---- compose identity ---------------------------------------------------------------------------------
[[key]]
name = "GBRAIN_PROJECT"
source = "host"
template = "{compose_project}"

[[key]]
name = "COMPOSE_PROFILES"
source = "host"
template = "{compose_profiles}"

[[key]]
name = "GBRAIN_HOST_NAME"
source = "host"
template = "{name}"

[[key]]
name = "GBRAIN_REVISION"
source = "host"
template = "{revision}"

[[key]]
name = "GBRAIN_SERVER_IMAGE"
source = "host"
template = "{server_image}"

[[key]]
name = "GBRAIN_RERANK_IMAGE"
source = "host"
template = "{rerank_image}"

[[key]]
name = "GBRAIN_CRON_IMAGE"
source = "host"
template = "{cron_image}"

# ---- postgres -----------------------------------------------------------------------------------------
[[key]]
name = "GBRAIN_PG_CONTAINER"
source = "host"
template = "{pg_container}"

[[key]]
name = "GBRAIN_PG_VOLUME"
source = "host"
template = "{pg_volume}"

[[key]]
name = "GBRAIN_PG_PORT"
source = "host"
template = "{ports.pg}"

# ---- server + rerank ----------------------------------------------------------------------------------
[[key]]
name = "GBRAIN_SERVE_PORT"
source = "host"
template = "{ports.serve}"

[[key]]
name = "GBRAIN_RERANK_PORT"
source = "host"
template = "{ports.rerank}"

[[key]]
name = "GBRAIN_RERANK_PRIMARY"
# the zerank-2 primary the proxy calls: the in-stack tunnel service, or (rerank_tunnel = false) a URL the host gives
source = "host"
template = "{rerank_primary}"

[[key]]
name = "GBRAIN_RERANK_TUNNEL_TARGET"
source = "host"
template = "{rerank_tunnel_target}"

[[key]]
name = "GBRAIN_ANTHROPIC_BASE_URL"
# the claude-apr relay (Max subscription, $0 API): the launcher's ANTHROPIC_BASE_URL, reached from the container
source = "host"
template = "http://{docker_host_gw}:{relay_ports.anthropic}/v1"

# ---- cron ---------------------------------------------------------------------------------------------
[[key]]
name = "GBRAIN_CRON_UID"
source = "host"
template = "{cron_uid}"

[[key]]
name = "GBRAIN_CRON_GID"
source = "host"
template = "{cron_gid}"

[[key]]
name = "GBRAIN_HOST_HOME"
# the host's gbrain dir; the brain repo is mounted at <this>/brain at the SAME path inside the cron container
source = "host"
template = "{path:gbrain_home}"

[[key]]
name = "GBRAIN_BRAIN_SOURCE"
# the host dir mounted there: the live brain repo on studio, an APFS clone of it on studio-proof
source = "host"
template = "{path:brain_source}"

[[key]]
name = "GBRAIN_RECEIPTS_DIR"
source = "host"
template = "{path:receipts_dir}"

[[key]]
name = "GBRAIN_BACKUP_STAMP_DIR"
source = "host"
template = "{path:backup_stamp_dir}"

[[key]]
name = "GBRAIN_GIT_NAME"
# author of the nightly brain-repo commit (the host commits were authored by the host's git identity)
source = "host"
template = "{git_name}"

[[key]]
name = "GBRAIN_GIT_EMAIL"
source = "host"
template = "{git_email}"

[[key]]
name = "GBRAIN_RESTIC_REPO"
source = "host"
template = "{restic.repo}"

[[key]]
name = "GBRAIN_RESTIC_HOST"
source = "host"
template = "{restic.host}"

[[key]]
name = "GBRAIN_RESTIC_INIT_OK"
source = "host"
template = "{restic.init_ok}"

# ---- secret files -------------------------------------------------------------------------------------
[[file]]
path = "openai-key"
# embeddings (the launcher's K1)
source = "1p"
ref = "op://p5fyqekdzsdp7rmdk3n4kjecse/zizaufjihwcwxk6am5rga5xpgm/credential"
readers = ["server", "cron"]

[[file]]
path = "anthropic-key"
# the launcher's K2; Anthropic traffic goes to the relay, so a miss is not fatal (launcher: WARN)
source = "1p"
ref = "op://p5fyqekdzsdp7rmdk3n4kjecse/jekclvorabox2wk3blakwj23lu/credential"
optional = true
readers = ["server", "cron"]

[[file]]
path = "pg-password"
# gbrain-postgres (the launcher's PGP and gbrain-pg-backup.sh's TCP password)
source = "1p"
ref = "op://p5fyqekdzsdp7rmdk3n4kjecse/7kixwucy2yik5ec5o4ipoupbhi/password"
readers = ["postgres", "server", "cron"]

[[file]]
path = "deepinfra-key"
# rerank fallback (rerank-failover-proxy.py OP_REF)
source = "1p"
ref = "op://p5fyqekdzsdp7rmdk3n4kjecse/DeepInfra/credential"
readers = ["rerank-proxy"]

[[file]]
path = "restic-password"
# the gbrain pg-restic repo key (= ~/.hermes/secrets/restic-mac-studio.key, sha-compared 2026-11-20)
source = "1p"
ref = "op://p5fyqekdzsdp7rmdk3n4kjecse/restic repo key - Mac Studio machines backup/password"
readers = ["cron"]

[[file]]
path = "nas-ssh-key"
# restic sftp to the NAS. 1P note `gbrain stack secrets v1` (operator creates it: README "Before the cutover")
source = "1p"
ref = "op://p5fyqekdzsdp7rmdk3n4kjecse/gbrain stack secrets v1/notesPlain"
field = "NAS_SSH_KEY_B64"
encoding = "base64"
when = "nas_backup"
readers = ["cron"]

[[file]]
path = "nas-known-hosts"
source = "1p"
ref = "op://p5fyqekdzsdp7rmdk3n4kjecse/gbrain stack secrets v1/notesPlain"
field = "NAS_KNOWN_HOSTS_B64"
encoding = "base64"
when = "nas_backup"
readers = ["cron"]

[[file]]
path = "tunnel-ssh-key"
# a DEDICATED key, authorized on the reranker host with restrict,port-forwarding,permitopen="127.0.0.1:8084"
source = "1p"
ref = "op://p5fyqekdzsdp7rmdk3n4kjecse/gbrain stack secrets v1/notesPlain"
field = "TUNNEL_SSH_KEY_B64"
encoding = "base64"
when = "rerank_tunnel"
readers = ["rerank-tunnel"]

[[file]]
path = "tunnel-known-hosts"
source = "1p"
ref = "op://p5fyqekdzsdp7rmdk3n4kjecse/gbrain stack secrets v1/notesPlain"
field = "TUNNEL_KNOWN_HOSTS_B64"
encoding = "base64"
when = "rerank_tunnel"
readers = ["rerank-tunnel"]

[[file]]
path = "config.json"
# ~/gbrain/.gbrain/config.json as of 2026-11-20 (engine postgres, self_upgrade off), with the reranker base URL
# pointed at the in-stack proxy. Not secret; rendered here so it has exactly one definition.
source = "host"
template = '{{"engine":"postgres","embedding_model":"openai:text-embedding-3-large","embedding_dimensions":1536,"schema_pack":"gbrain-base-v2","mcp":{{"publish_skills":true}},"self_upgrade":{{"mode":"off","mode_prompted":true}},"link_resolution":{{"global_basename":true}},"provider_base_urls":{{"llama-server-reranker":"http://rerank-proxy:18085/v1"}}}}'
newline = true
readers = ["server", "cron"]

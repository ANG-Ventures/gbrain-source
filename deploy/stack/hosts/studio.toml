# hosts/studio.toml: the Mac Studio, gbrain's serving host (card t_ab2fcba3). Reviewed in git; NO secrets.
# The only place a host address, port map or host path may appear (the mem0-selfhost-deploy hosts/*.toml rule).
# Paths starting with ~ expand against the HOME of whoever runs gbrainctl.
name            = "studio"
os              = "darwin"
arch            = "arm64"
docker_host_gw  = "host.docker.internal"   # OrbStack name for the host loopback (mem0's hosts/studio.toml)

# the build every container of this host runs: ANG-Ventures/gbrain-source commit, built per arch by `gbrainctl build`
# Pinned by card t_bb0e9194: master 7969d968 = 9bd1cfeb (what ~/gbrain/app serves, read 2026-11-23) + deploy/stack
# (#10, #11); `git diff 9bd1cfeb 7969d968 -- . ':!deploy/stack'` is empty, so the app code is the launchd serve's.
revision        = "7969d9685cfb37a2d7c695a6a94d4d4aaa4f4ae7"
server_image    = "gbrain-server:7969d9685cfb-arm64"
rerank_image    = "gbrain-rerank:7969d9685cfb-arm64"
cron_image      = "gbrain-cron:7969d9685cfb-arm64"
# Built on the Studio by `gbrainctl build --host studio` 2026-11-23 08:3x PT (t_bb0e9194, BUILD=ok in 67 s), each
# labelled org.opencontainers.image.revision=<revision>, User 502:20. Local image ids (config digests; these images
# are never pushed, compose runs them with pull_policy: never, so the revision label is what status/watch check):
#   server sha256:e0c49e16913b9c774dcd7950fc75448e6fab42120d0465dfb0118b14de51cf03
#   rerank sha256:13e42a9d7d40311b6c508841f28eb8d603daae8950e2b746a4502010dd43a756
#   cron   sha256:08a02227bc5572943de3113d419066d3da1416ab3695e84c40a158396ed63771

# compose (the checkout `gbrainctl` runs from is the deploy tree; compose files are relative to deploy/stack)
compose_project = "gbrain"
compose_files   = ["docker-compose.yaml", "docker-compose.studio.yaml"]
stack_dir       = "~/gbrain-stack-live/deploy/stack"   # a detached checkout of gbrain-source at `revision`, never ~/gbrain/app
pg_container    = "gbrain-pg"            # the name the backup drills, the reaper policy and the fleet lints know
pg_volume       = "gbrain-pgdata"        # the EXISTING volume (external)
ports           = { pg = 5433, serve = 8199, rerank = 18085 }   # the launchd-era ports: every caller keeps its URL
relay_ports     = { anthropic = 18810 }  # claude-apr relay (the launcher's ANTHROPIC_BASE_URL)

# rerank path: the in-stack tunnel to zerank-native on ACE-AI
rerank_tunnel        = true
rerank_tunnel_target = "ace@192.168.1.216"
rerank_primary       = "http://rerank-tunnel:18084"

# cron
nas_backup       = true
# the non-root uid:gid EVERY stack image runs as (baked by `gbrainctl build`): the owner of ~/gbrain/brain and the
# user who runs gbrainctl (so the 0600 rendered secrets it bind-mounts are readable by the same uid on any runtime)
stack_uid        = 502
stack_gid        = 20
gbrain_home      = "~/gbrain"            # GBRAIN_HOME in the cron container; the brain is mounted at <this>/brain
brain_source     = "~/gbrain/brain"
git_name         = "Kyzcreig"                                   # the brain repo nightly commits' author (host git config)
git_email        = "9063726+Kyzcreig@users.noreply.github.com"
receipts_dir     = "~/.hermes/state/gbrain-stack"
backup_stamp_dir = "~/.hermes/state/backup"   # last-success-gbrain-pg-backup, read by the fleet backup freshness check
restic           = { repo = "sftp:truenas_admin@192.168.1.159:/mnt/tank/backups/gbrain/pg-restic", host = "mac-studio-m3u", init_ok = 0 }

# tools
op_reader       = "~/.hermes/scripts/op-cached-read"
op_bin          = "/opt/homebrew/bin/op"
op_token_file   = "~/.hermes/.op-service-token"

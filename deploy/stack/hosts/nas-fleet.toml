# hosts/nas-fleet.toml: the gbrain WARM STANDBY (card t_dd1e1edb, STANDBY.md). Reviewed in git; NO secrets.
# nas-fleet = the Ubuntu 24.04 LXC on the TrueNAS box (Ryzen 9 7950X, 32 threads, 124 GB, docker 29.1.3), the same
# box as the mem0 standby. The Studio stays the primary (owner ruling, Discord 1573571257654579233). This host runs a
# Postgres physical streaming replica of the Studio's gbrain-pg, fed over a restricted ssh link; the server and cron
# containers EXIST but never start here while it is the standby (one cron ever). `gbrainctl standby status --host
# nas-fleet` is the doctor; `gbrainctl swap --to nas-fleet` the one command that makes it the primary.
name            = "nas-fleet"
os              = "linux"
arch            = "amd64"
lan_ip          = "192.168.1.154"
# The claude-apr relay (`think` only) is Studio loopback: nothing on this host answers it, so a promoted standby has
# search, query and graph but no `think` (STANDBY.md "What a promoted NAS lacks").
docker_host_gw  = "host.docker.internal"

# The SAME commit as hosts/studio.toml (the doctor compares the created server/cron images' revision label with the
# primary's `revision`), built here for amd64 by `gbrainctl build --host nas-fleet` at uid 1000 (ace on nas-fleet).
# Re-pin in the same PR whenever studio.toml's revision moves, then `gbrainctl standby repin` here.
revision        = "7969d9685cfb37a2d7c695a6a94d4d4aaa4f4ae7"
server_image    = "gbrain-server:7969d9685cfb-amd64"
rerank_image    = "gbrain-rerank:7969d9685cfb-amd64"
cron_image      = "gbrain-cron:7969d9685cfb-amd64"

compose_project = "gbrain"
compose_files   = ["docker-compose.yaml", "docker-compose.nas-fleet.yaml",
                   "docker-compose.standby.yaml"]   # `gbrainctl swap` drops the last one when it promotes this host
stack_dir       = "~/gbrain-standby/deploy/stack"   # a detached checkout of gbrain-source (carried in: no GitHub creds)
pg_container    = "gbrain-pg"
pg_volume       = "gbrainstandby_pg"     # a docker local volume bound to <[standby] data_root>/pg (standby init)
ports           = { pg = 5433, serve = 8199, rerank = 18085 }   # all 127.0.0.1 on this host (free, read 2026-11-24)
relay_ports     = { anthropic = 18810 }

rerank_tunnel        = true                # the same zerank-native on ACE-AI, reached from this LAN address
rerank_tunnel_target = "ace@192.168.1.216"
rerank_primary       = "http://rerank-tunnel:18084"

# cron (runs only after a promotion). The brain repo is the Studio's (~/gbrain/brain: the exporters write it there);
# this host mounts an EMPTY repo, so a promoted standby's nightly-sync imports nothing new until the swap back, and the
# Studio's first night after it imports everything (incremental by content hash). pg-backup goes to the same restic
# repo under the same restic host, so the dumps form one chain whichever box is the primary.
nas_backup       = true
stack_uid        = 1000
stack_gid        = 1000
gbrain_home      = "/srv/gbrain-standby/gbrain"
brain_source     = "/srv/gbrain-standby/gbrain/brain"   # `gbrainctl standby init` makes it an empty git repo
git_name         = "Kyzcreig"
git_email        = "9063726+Kyzcreig@users.noreply.github.com"
receipts_dir     = "~/.hermes/state/gbrain-stack"
backup_stamp_dir = "~/.hermes/state/backup"
restic           = { repo = "sftp:truenas_admin@192.168.1.159:/mnt/tank/backups/gbrain/pg-restic", host = "mac-studio-m3u", init_ok = 0 }

# tools (the read-only Engineering SA token hermes-home `fleet-host onboard nas-fleet --fix op-token-readonly` placed)
op_reader       = "~/.local/bin/op-cached-read"
op_bin          = "/usr/bin/op"
op_token_file   = "~/.hermes/.op-service-token"

# The standby (t_dd1e1edb). Its data lives on TrueNAS dataset tank/gbrain-standby (recordsize 16K, special_small_blocks
# 16K -> the SSD special mirror, lz4, atime off; the mem0 standby's settings), hot-plugged at /srv/gbrain-standby.
[standby]
primary          = "studio"                # hosts/<primary>.toml: its `revision` is the pin the doctor compares
link_ssh         = "_studiolink@192.168.1.18"
# the Studio's ed25519 host key (= mem0's hosts/nas-fleet.toml link_host_key, read 2026-11-21)
link_host_key    = "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIMebm4S6lQ8UAVoUveGAHCUvlUj5zZ28IpWDsScDWxf6"
primary_pg       = "127.0.0.1:5433"        # the primary's loopback ports, reached through the link (permitopen)
primary_serve    = "127.0.0.1:8199"
repl_role        = "gbrain_repl"
slot             = "gbrain_standby_nas_fleet"
application_name = "nas-fleet"
data_root        = "/srv/gbrain-standby"   # tank/gbrain-standby
lag_page_s       = 60
basebackup_rate  = "100M"                  # pg_basebackup -r: bounds the read burst on the Studio
mark             = "t_dd1e1edb"            # the tag on the Studio's role/hba/key lines for this standby

# `gbrainctl swap` runs this host's own steps here, over ssh, in its checkout at stack_dir.
[swap]
ssh             = "ace@192.168.1.154"
callers_host    = "studio"                 # every gbrain caller is on the Studio (127.0.0.1:8199); prove goes there

# When this host is the PRIMARY, the Studio follows it through this host's sshd as _mem0link (the mem0 reverse link,
# mem0-selfhost-deploy docs/SWAP.md 3.3: one restricted forwarding login, its own tagged key line per store).
[link]
keys_file       = "/etc/ssh/mem0link_authorized_keys"
